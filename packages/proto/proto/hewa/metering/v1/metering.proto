syntax = "proto3";

package hewa.metering.v1;

import "google/protobuf/timestamp.proto";

// A single meter reading, as it arrives from the network.
message MeterReading {
  string reading_id = 1;
  string subscriber_id = 2;
  string isp_id = 3;
  // Instant the reading describes, not the instant it was received.
  google.protobuf.Timestamp measured_at = 4;
  // Average throughput over the sample interval, in Mbps.
  double average_mbps = 5;
  // Peak over the same interval, in Mbps.
  double peak_mbps = 6;
  // Bytes transferred over the sample interval.
  int64 bytes_in = 7;
  int64 bytes_out = 8;
}

// Readings were accepted and are now in the stream.
message UsageIngested {
  string reading_id = 1;
  string subscriber_id = 2;
  int32 readings_in_batch = 3;
  // RFC 3339 timestamp.
  google.protobuf.Timestamp ingested_at = 4;
}

// A rating period was closed and its totals are final.
//
// Published once the window can no longer change, so anything downstream that
// rates or bills from it will not have its number revised underneath it.
message UsageWindowClosed {
  string subscriber_id = 1;
  string isp_id = 2;
  // `YYYY-MM` for a monthly period.
  string period = 3;
  // Mean throughput across the whole period, in Mbps.
  double average_mbps = 4;
  // Highest sustained throughput in the period, in Mbps.
  double peak_mbps = 5;
  int64 total_bytes = 6;
  // Availability actually delivered, in basis points: 9995 is 99.95%.
  uint32 sla_actual_bps = 7;
  google.protobuf.Timestamp closed_at = 8;
}

// Measured availability fell short of what was committed.
message SlaBreached {
  string subscriber_id = 1;
  string isp_id = 2;
  string period = 3;
  // Committed and delivered availability, in basis points.
  uint32 sla_committed_bps = 4;
  uint32 sla_actual_bps = 5;
  // Credit per whole point missed, as an exact fraction of the month's charge.
  uint32 credit_numerator = 6;
  uint32 credit_denominator = 7;
  google.protobuf.Timestamp detected_at = 8;
}
