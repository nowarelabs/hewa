syntax = "proto3";

package hewa.metering.v1;

import "google/protobuf/timestamp.proto";
import "hewa/common/v1/common.proto";

// A single meter reading, as it arrives from the network.
message MeterReading {
  string reading_id = 1;
  string subscriber_id = 2;
  string isp_id = 3;
  // Instant the reading describes, not the instant it was received.
  google.protobuf.Timestamp measured_at = 4;
  // Average throughput over the sample interval, in Mbps.
  double average_mbps = 5;
  // Peak over the same interval, in Mbps.
  double peak_mbps = 6;
  // Bytes transferred over the sample interval.
  int64 bytes_in = 7;
  int64 bytes_out = 8;
}

// Readings were accepted and are now in the stream.
message UsageIngested {
  string reading_id = 1;
  string subscriber_id = 2;
  // The ISP the readings belong to. Carried here so the topic can be
  // partitioned by `isp_id`: without it there is no field on this event to
  // hash, and an ingestion event that cannot be routed to its ISP's partition
  // is a design flaw rather than a missing optimisation.
  string isp_id = 5;
  int32 readings_in_batch = 3;
  // RFC 3339 timestamp.
  google.protobuf.Timestamp ingested_at = 4;
}

// A rating period was closed and its totals are final.
//
// Published once the window can no longer change, so anything downstream that
// rates or bills from it will not have its number revised underneath it.
message UsageWindowClosed {
  string subscriber_id = 1;
  string isp_id = 2;
  // `YYYY-MM` for a monthly period.
  string period = 3;
  // Mean throughput across the whole period, in Mbps.
  double average_mbps = 4;
  // Highest sustained throughput in the period, in Mbps.
  double peak_mbps = 5;
  int64 total_bytes = 6;
  // Availability actually delivered, in basis points: 9995 is 99.95%.
  uint32 sla_actual_bps = 7;
  google.protobuf.Timestamp closed_at = 8;
}

// Measured availability fell short of what was committed.
message SlaBreached {
  string subscriber_id = 1;
  string isp_id = 2;
  string period = 3;
  // Committed and delivered availability, in basis points.
  uint32 sla_committed_bps = 4;
  uint32 sla_actual_bps = 5;
  // Credit per whole point missed, as an exact fraction of the month's charge.
  uint32 credit_numerator = 6;
  uint32 credit_denominator = 7;
  google.protobuf.Timestamp detected_at = 8;
}

message IngestReadingRequest {
  MeterReading reading = 1;
  // Idempotency key, unique per meter. A device that retries a reading after a
  // timeout would otherwise double-count, and a doubled reading inflates an
  // overage charge by a whole interval with nothing to detect it.
  string idempotency_key = 2;
}

message IngestReadingResponse {
  // Whether this reading was recorded or recognised as a duplicate. A caller
  // that sees `false` has to treat the RPC as successful, not as failed.
  bool accepted = 1;
  // True when the reading matched an earlier one and was dropped.
  bool duplicate = 2;
}

message GetUsageRequest {
  string customer_id = 1;
  uint32 month = 2;
}

message GetUsageResponse {
  repeated MeterReading readings = 1;
  // True when the window closed, i.e. the figures are final. An open window's
  // total is a running total and is not a billable number.
  bool closed = 2;
}

message CloseWindowRequest {
  string isp_id = 1;
  uint32 month = 2;
}

message CloseWindowResponse {
  // The per-ISP totals that were closed. Returned rather than fetched, so the
  // caller and the books cannot disagree about what was published.
  repeated UsageWindowClosed windows = 1;
}

message EvaluateSlaRequest {
  string customer_id = 1;
  uint32 month = 2;
  // Availability actually achieved, in basis points. An integer, never a
  // percentage float: the credit is `numerator / denominator` against it, and
  // a float has already lost the digits by the time it is multiplied.
  int64 achieved_basis_points = 3;
  // The commitment being measured against, in basis points.
  int64 committed_basis_points = 4;
  // The amount the credit may be taken from: commitment plus overage, not the
  // commitment alone.
  hewa.common.v1.Money creditable_basis = 5;
}

message EvaluateSlaResponse {
  // Zero when the commitment was met.
  hewa.common.v1.Money credit = 1;
  bool breached = 2;
}

// Ingests meter readings and closes the monthly window.
//
// The window close is the one write here that is not idempotent by key, and it
// is deliberately so: closing a month twice would publish two different sets of
// totals for the same period, and a consumer that took the second would
// overstate the month. It refuses instead.
service MeteringService {
  rpc IngestReading(IngestReadingRequest) returns (IngestReadingResponse);
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);
  rpc CloseWindow(CloseWindowRequest) returns (CloseWindowResponse);
  rpc EvaluateSla(EvaluateSlaRequest) returns (EvaluateSlaResponse);
}
