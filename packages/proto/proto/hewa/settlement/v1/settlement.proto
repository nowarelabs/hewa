syntax = "proto3";

package hewa.settlement.v1;

import "google/protobuf/timestamp.proto";
import "hewa/common/v1/common.proto";

enum PayoutStatus {
  PAYOUT_STATUS_UNSPECIFIED = 0;
  PAYOUT_STATUS_PENDING = 1;
  PAYOUT_STATUS_CONVERTING = 2;
  PAYOUT_STATUS_SENDING = 3;
  PAYOUT_STATUS_COMPLETED = 4;
  PAYOUT_STATUS_FAILED = 5;
}

// A rate to settle against, valid for a short window.
//
// The expiry is part of the quote rather than implied by its age, because the
// two ends of a settlement run are seconds apart and the rate they use has to
// be provably the same one.
message ConversionQuote {
  string quote_id = 1;
  string from_currency = 2;
  string to_currency = 3;
  // Rate as an exact fraction, `numerator / denominator`. A double cannot carry
  // a rate that both parties can independently recompute.
  int64 rate_numerator = 4;
  int64 rate_denominator = 5;
  string provider = 6;
  google.protobuf.Timestamp expires_at = 7;
}

// What an ISP is owed, and where it is going.
message PayoutObligation {
  string payout_id = 1;
  string isp_id = 2;
  // The obligation, in USD.
  hewa.common.v1.Money amount = 3;
  // Stablecoin amount, present only once a quote has been taken.
  hewa.common.v1.Money converted_amount = 4;
  string quote_id = 5;
  // EVM address; empty when the ISP is paid by bank transfer.
  string destination = 6;
  int64 chain_id = 7;
  string symbol = 8;
  PayoutStatus status = 9;
  // Correlation back to the bill this settles, so a retried run cannot pay it
  // twice.
  string reference = 10;
  google.protobuf.Timestamp created_at = 11;
}

message PayoutCreated {
  string payout_id = 1;
  string isp_id = 2;
  hewa.common.v1.Money amount = 3;
  string reference = 4;
  google.protobuf.Timestamp created_at = 5;
}

message PayoutSettled {
  string payout_id = 1;
  string isp_id = 2;
  hewa.common.v1.Money converted_amount = 3;
  string transaction_hash = 4;
  int64 chain_id = 5;
  google.protobuf.Timestamp settled_at = 6;
}

message PayoutFailed {
  string payout_id = 1;
  string isp_id = 2;
  string reason = 3;
  google.protobuf.Timestamp failed_at = 4;
}
