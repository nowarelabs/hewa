syntax = "proto3";

package hewa.billing.v1;

import "google/protobuf/timestamp.proto";
import "hewa/common/v1/common.proto";

enum InvoiceStatus {
  INVOICE_STATUS_UNSPECIFIED = 0;
  INVOICE_STATUS_DRAFT = 1;
  INVOICE_STATUS_ISSUED = 2;
  INVOICE_STATUS_PAID = 3;
  INVOICE_STATUS_OVERDUE = 4;
  INVOICE_STATUS_DISPUTED = 5;
  INVOICE_STATUS_VOID = 6;
}

enum DisputeStatus {
  DISPUTE_STATUS_UNSPECIFIED = 0;
  DISPUTE_STATUS_OPEN = 1;
  DISPUTE_STATUS_UNDER_REVIEW = 2;
  DISPUTE_STATUS_ACCEPTED = 3;
  DISPUTE_STATUS_REJECTED = 4;
  DISPUTE_STATUS_RESOLVED = 5;
}

// One rated line on an invoice.
message InvoiceLine {
  string line_id = 1;
  string description = 2;
  // `YYYY-MM` for a recurring charge.
  string period = 3;
  hewa.common.v1.Money amount = 4;
  // Portion of `amount` that is an SLA credit rather than a charge. A credit
  // never exceeds the line it reduces.
  hewa.common.v1.Money credit = 5;
}

message Invoice {
  string invoice_id = 1;
  string customer_id = 2;
  string isp_id = 3;
  InvoiceStatus status = 4;
  repeated InvoiceLine lines = 5;
  hewa.common.v1.Money subtotal = 6;
  hewa.common.v1.Money tax = 7;
  hewa.common.v1.Money total = 8;
  // Outstanding balance, which is not the same as the total once a payment
  // has been partially applied.
  hewa.common.v1.Money amount_due = 9;
  google.protobuf.Timestamp issued_at = 10;
  google.protobuf.Timestamp due_at = 11;
}

message InvoiceIssued {
  string invoice_id = 1;
  string customer_id = 2;
  hewa.common.v1.Money total = 3;
  google.protobuf.Timestamp due_at = 4;
}

message PaymentReceived {
  string payment_id = 1;
  string invoice_id = 2;
  string customer_id = 3;
  hewa.common.v1.Money amount = 4;
  // Gateway the money actually came in through, e.g. `mpesa`, `card`.
  string method = 5;
  string gateway_reference = 6;
  google.protobuf.Timestamp received_at = 7;
}

// An invoice line did not match what the customer was charged.
message InvoiceDisputed {
  string dispute_id = 1;
  string invoice_id = 2;
  string line_id = 3;
  string customer_id = 4;
  DisputeStatus status = 5;
  string reason = 6;
  // Difference between what was billed and what the customer says is owed.
  hewa.common.v1.Money amount_in_question = 7;
  google.protobuf.Timestamp raised_at = 8;
}

message DisputeResolved {
  string dispute_id = 1;
  string invoice_id = 2;
  DisputeStatus status = 3;
  // Credit issued against the invoice, if the dispute was upheld.
  hewa.common.v1.Money adjustment = 4;
  google.protobuf.Timestamp resolved_at = 5;
}

message CalculateBillRequest {
  string isp_id = 1;
  string customer_id = 2;
  // The month being billed, as `YYYYMM`. Not a timestamp: a bill is for a
  // calendar month, and deriving one from a date in a timezone is a bug that
  // only shows up at month boundaries.
  uint32 month = 3;
  hewa.common.v1.Money commitment_charge = 4;
  hewa.common.v1.Money overage_charge = 5;
  // A credit already granted for SLA misses, as a positive amount to deduct.
  hewa.common.v1.Money sla_credit = 6;
}

message CalculateBillResponse {
  Invoice invoice = 1;
  // What was owed before the SLA credit, so a support agent can show the
  // customer the service level they were credited for rather than only the
  // reduced total.
  hewa.common.v1.Money subtotal = 2;
}

message GetInvoiceRequest {
  string invoice_id = 1;
}

message GetInvoiceResponse {
  Invoice invoice = 1;
}

message ListInvoicesRequest {
  string customer_id = 1;
  InvoiceStatus status = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
  string next_page_token = 2;
}

message RecordPaymentRequest {
  string invoice_id = 1;
  hewa.common.v1.Money amount = 2;
  // The caller's unique reference for this payment. A retried `RecordPayment`
  // that applied twice would mark an invoice settled that is not, so the
  // reference is what makes the write idempotent rather than the amount.
  string idempotency_key = 3;
}

message RecordPaymentResponse {
  Invoice invoice = 1;
  // What remains after this payment. A second application of the same payment
  // leaves this unchanged.
  hewa.common.v1.Money outstanding = 2;
}

message RaiseDisputeRequest {
  string invoice_id = 1;
  string reason = 2;
  // The disputed lines. Empty means the whole invoice.
  repeated string line_ids = 3;
}

message RaiseDisputeResponse {
  string dispute_id = 1;
}

message ResolveDisputeRequest {
  string dispute_id = 1;
  DisputeStatus status = 2;
  // The credit granted in settlement, if any.
  hewa.common.v1.Money adjustment = 3;
}

message ResolveDisputeResponse {
  Invoice invoice = 1;
}

message ReceivablesSummaryRequest {
  string isp_id = 1;
}

message ReceivablesSummaryResponse {
  hewa.common.v1.Money outstanding = 1;
  hewa.common.v1.Money overdue = 2;
}

// Owns the invoice aggregate, disputes, and the commitment-plus-overage bill.
service BillingService {
  rpc CalculateBill(CalculateBillRequest) returns (CalculateBillResponse);
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc RecordPayment(RecordPaymentRequest) returns (RecordPaymentResponse);
  rpc RaiseDispute(RaiseDisputeRequest) returns (RaiseDisputeResponse);
  rpc ResolveDispute(ResolveDisputeRequest) returns (ResolveDisputeResponse);
  rpc ReceivablesSummary(ReceivablesSummaryRequest) returns (ReceivablesSummaryResponse);
}
