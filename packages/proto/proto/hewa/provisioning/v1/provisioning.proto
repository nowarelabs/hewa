syntax = "proto3";

package hewa.provisioning.v1;

import "google/protobuf/timestamp.proto";

enum ProvisioningStatus {
  PROVISIONING_STATUS_UNSPECIFIED = 0;
  PROVISIONING_STATUS_PENDING = 1;
  PROVISIONING_STATUS_ACTIVATING = 2;
  PROVISIONING_STATUS_ACTIVE = 3;
  PROVISIONING_STATUS_FAILED = 4;
}

// The suite an ISP's records came from, e.g. `Openet`, `Amdocs`, `Custom`.
enum BssOssSystem {
  BSS_OSS_SYSTEM_UNSPECIFIED = 0;
  BSS_OSS_SYSTEM_OPENET = 1;
  BSS_OSS_SYSTEM_AMDOCS = 2;
  BSS_OSS_SYSTEM_CUSTOM = 3;
}

message CustomerOrder {
  string external_id = 1;
  string isp_id = 2;
  string customer_name = 3;
  int32 committed_mbps = 4;
  int32 burst_mbps = 5;
  BssOssSystem source_system = 6;
  google.protobuf.Timestamp synced_at = 7;
}

// A customer order was picked up from the ISP's own system.
message OrderSynced {
  string external_id = 1;
  string isp_id = 2;
  BssOssSystem source_system = 3;
  int32 committed_mbps = 4;
  google.protobuf.Timestamp synced_at = 5;
}

message SubscriberActivated {
  string subscriber_id = 1;
  string external_id = 2;
  string isp_id = 3;
  int32 committed_mbps = 4;
  google.protobuf.Timestamp activated_at = 5;
}

message ProvisioningFailed {
  string subscriber_id = 1;
  string external_id = 2;
  string isp_id = 3;
  string reason = 4;
  // Whether the ISP's system was told, so a failure is not invisible to them.
  bool reported_upstream = 5;
  google.protobuf.Timestamp failed_at = 6;
}

message SubmitOrderRequest {
  CustomerOrder order = 1;
  // Idempotency key, unique per BSS/OSS. Submitting the same order twice would
  // provision the same subscriber twice, and a duplicate activation is a
  // customer with two circuits and one bill.
  string idempotency_key = 2;
}

message SubmitOrderResponse {
  CustomerOrder order = 1;
  // False when the order was recognised as already submitted. Success, not
  // failure: the caller wanted it provisioned once and it is.
  bool duplicate = 2;
}

message GetCustomerOrderRequest {
  string order_id = 1;
}

message GetCustomerOrderResponse {
  CustomerOrder order = 1;
}

message ListCustomerOrdersRequest {
  string isp_id = 1;
  ProvisioningStatus status = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListCustomerOrdersResponse {
  repeated CustomerOrder orders = 1;
  string next_page_token = 2;
}

message RetryProvisioningRequest {
  string order_id = 1;
}

message RetryProvisioningResponse {
  CustomerOrder order = 1;
}

// Drives a BSS/OSS order through to an active subscriber.
//
// The vendor is behind an interface, not an import, so this service is the only
// thing that knows an Amdocs wire format exists. It is also the only place a
// vendor's error body could leak customer data into our logs, so an upstream
// failure arrives here as a status and a generic reason — never the vendor's
// own message.
service ProvisioningService {
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);
  rpc GetCustomerOrder(GetCustomerOrderRequest) returns (GetCustomerOrderResponse);
  rpc ListCustomerOrders(ListCustomerOrdersRequest) returns (ListCustomerOrdersResponse);
  rpc RetryProvisioning(RetryProvisioningRequest) returns (RetryProvisioningResponse);
}
