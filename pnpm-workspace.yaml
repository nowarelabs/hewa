packages:
  - apps/*
  - packages/*
  - services/*
  - infra-services/*
  - tools/*

catalogMode: prefer

catalog:
  # Toolchain
  "@changesets/cli": ^3
  "@types/node": ^26
  typescript: ^6
  vite: npm:@voidzero-dev/vite-plus-core@^1
  vite-plus: ^1

  # NestJS services
  "@nestjs/cli": ^12
  "@nestjs/common": ^12
  "@nestjs/config": ^12
  "@nestjs/core": ^12
  "@nestjs/platform-express": ^12
  "@nestjs/schematics": ^12
  "@nestjs/testing": ^12
  "@types/express": ^5
  reflect-metadata: ^0.2
  rxjs: ^7

  # Next.js apps
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5
  "@types/react-dom": ^19
  "@types/react": ^19
  lucide-react: ^1.48.0
  next: ^16
  nuqs: ^2.10.1
  react-dom: ^19
  react: ^19
  tailwindcss: ^4.3.3

  # Astro blog
  "@astrojs/node": ^11
  astro: ^7

  # Protobuf / buf
  "@bufbuild/buf": ^1
  "@bufbuild/protobuf": ^2
  "@bufbuild/protoc-gen-es": ^2
  "@connectrpc/connect": ^2
  "@connectrpc/connect-node": ^2

  # PostgreSQL
  #
  # `drizzle-orm` speaks to a real PostgreSQL server over `pg` in every service and
  # to an in-process one over PGlite in the tests. Both are the same engine — PGlite
  # is PostgreSQL compiled to WebAssembly — so the e2e suite applies the same
  # generated SQL migrations a deploy runs, and no test needs a database server
  # that the developer has to remember to start.
  drizzle-orm: ^0.45.3
  pg: ^8.23.1
  "@electric-sql/pglite": ^0.5.8
  # Generates the SQL migrations in `drizzle/` from `src/db/schema.ts`. A dev
  # dependency: the migrations it writes are committed, so a consumer — a deploy,
  # a test, the seed script — never has to run it.
  drizzle-kit: ^0.31.11
  # Runs the seed script and the migration tool over this workspace's TypeScript,
  # which resolves the `.js` specifiers in the sources to the `.ts` files beside
  # them. Node's own type stripping will not: it matches specifiers literally.
  tsx: ^4
  "@types/pg": ^8

  # Infrastructure services
  "@aws-sdk/client-s3": ^3
  bullmq: ^6
  ethers: ^6
  "@hono/node-server": ^1
  hono: ^4
  ioredis: ^6
  kafkajs: ^2
  # Fails a build when a module that must never reach the browser can reach it.
  # The BFF in `apps/admin-dashboard/src/app/api/v1` reads the service token, and
  # this is what turns "somebody imported it into a client component" into a build
  # error instead of a credential in the client bundle.
  server-only: ^0.0.1
  recharts: ^3.10.1
  # A DOM for the tests that need one. Scoped to the files that ask for it
  # with a `@vitest-environment` docblock, so the rest of the suite stays in
  # node and a control primitive's keyboard behaviour is testable at all.
  happy-dom: ^20

overrides:
  vite@*: "catalog:"

# Packages that need a postinstall to work at all. @bufbuild/buf resolves its
# platform binary there; esbuild installs its own. Anything listed is an
# explicit supply-chain decision, which is the point of the allowlist.
allowBuilds:
  "@bufbuild/buf": true
  esbuild: true
  # BullMQ pulls in msgpackr, which offers a native extractor as a pure
  # speed-up. msgpackr falls back to its own JavaScript codec, so the build
  # script buys nothing here and is denied rather than trusted.
  msgpackr-extract: false

# Keep injected workspace dependencies in sync after a package is built.
syncInjectedDepsAfterScripts:
  - build

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Deliberate, one-time exception: Vite+ 1.0.0 was published hours before this
# workspace was created, so pnpm's minimum release age would hold the install at
# 0.3.x. pnpm only accepts exact versions here, hence the platform list. Delete
# this block once 1.0.0 has aged past the gate; the catalog range keeps tracking
# 1.x either way.
minimumReleaseAgeExclude:
  - vite-plus@1.0.0
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
